<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>攝影挑戰 - 登入</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark d-flex align-items-center" style="height: 100vh;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-4">
        <div class="card shadow-lg">
          <div class="card-body p-5">
            <h2 class="text-center mb-4">📸 登入挑戰</h2>
            <form th:action="@{/login}" method="post">

              <div class="mb-3">
                <label>Email</label>
                <input type="text" name="email" class="form-control" required>
              </div>

              <div class="mb-3">
                <label>密碼</label>
                <input type="password" name="password" class="form-control" required>
              </div>

              <button type="submit" class="btn btn-primary">進入 52 週主題</button>
            </form>

            <div class="text-center mt-4">
              <p class="text-muted">還沒有帳號嗎？
                <a th:href="@{/register}" class="btn btn-outline-secondary btn-sm ms-2">立即註冊</a>
              </p>
            </div>

            <div th:if="${param.success}" class="alert alert-success mt-3">
              註冊成功！現在可以用新帳號登入了。
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
