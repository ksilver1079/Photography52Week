<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>52 週攝影挑戰 - 計畫選擇</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }

    .card {
      transition: transform 0.2s, box-shadow 0.2s;
      border: none;
      border-radius: 15px;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1) !important;
    }

    .btn-start {
      font-weight: bold;
      border-radius: 10px;
    }

    .user-nav {
      background: white;
      padding: 10px 20px;
      border-radius: 50px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
    }

    .header-logo {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }
  </style>
</head>

<body>

  <div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-5">
      <div>
        <a th:if="${#authorization.expression('hasRole(''ADMIN'')')}" th:href="@{/admin/plans}"
          class="btn btn-warning btn-sm rounded-pill px-3 shadow-sm">
          ⚙️ 計畫管理後台
        </a>
      </div>

      <div class="user-nav d-flex align-items-center gap-3">
        <div th:if="${#authorization.expression('isAuthenticated()')}" class="d-flex align-items-center">
          <span class="text-muted small me-3">
            👤 <span class="fw-bold" th:text="${#authentication.name}">使用者</span>
            (<span th:text="${userDisplayName}">攝影師</span>)
          </span>
          <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-outline-danger btn-sm rounded-pill px-3">🚪 登出</button>
          </form>
        </div>
        <div th:unless="${#authorization.expression('isAuthenticated()')}">
          <a th:href="@{/login}" class="btn btn-primary btn-sm rounded-pill px-4">🔑 登入系統</a>
        </div>
      </div>
    </div>

    <header class="text-center mb-5">
      <div class="header-logo">📸</div>
      <h1 class="display-4 fw-bold mb-3">52 週攝影挑戰</h1>
      <p class="lead text-muted">挑戰自我，用鏡頭記錄52週的光影故事</p>
    </header>

    <hr class="my-5 opacity-25">

    <section>
      <h3 class="mb-4 text-center fw-bold">🎯 選擇你的挑戰計畫</h3>

      <div th:if="${not #lists.isEmpty(plans)}" class="row g-4 justify-content-center">
        <div class="col-xl-4 col-lg-4 col-md-6" th:each="p : ${plans}" th:if="${p.isEnabled}">
          <div class="card h-100 shadow-sm">
            <div class="card-body p-4 d-flex flex-column text-center">
              <div class="mb-3">
                <span class="badge bg-primary-subtle text-primary border border-primary-subtle rounded-pill px-3">
                  52 Weeks
                </span>
              </div>

              <h4 class="card-title fw-bold mb-3" th:text="${p.name}">計畫名稱</h4>

              <!--              <p class="text-muted small mb-4">
                這是一個為期 52 週的挑戰，包含 <strong th:text="${p.totalTopics}">52</strong> 項獨特的攝影主題。
              </p> -->

              <a th:href="@{/progress/start(planId=${p.id})}" class="btn btn-primary mt-auto btn-start py-2 shadow-sm">
                開始挑戰
              </a>
            </div>
          </div>
        </div>
      </div>

      <div th:if="${#lists.isEmpty(plans)}" class="text-center py-5">
        <div class="mb-3 fs-1">📭</div>
        <p class="text-muted">目前暫無可用的攝影計畫，請聯繫管理員建立。</p>
      </div>
    </section>

    <footer class="mt-5 pt-5 text-center text-muted border-top">
      <p class="small">&copy; 2026 52-Week Photography Challenge | Darren's Project</p>
      <p class="small">Tainan, Xinshi | Developer Mode</p>
    </footer>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
