<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>計畫管理中心</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="fw-bold">⚙️ 計畫管理中心</h2>
      <div>
        <button type="button" class="btn btn-primary rounded-pill px-4 shadow-sm" data-bs-toggle="modal"
          data-bs-target="#addPlanModal">
          ➕ 新增挑戰計畫
        </button>
        <a href="/" class="btn btn-outline-secondary rounded-pill ms-2">回首頁</a>
      </div>
    </div>

    <div class="card border-0 shadow-sm" style="border-radius: 15px;">
      <div class="card-body p-4">
        <table class="table table-hover align-middle">
          <thead>
            <tr>
              <th>計畫名稱</th>
              <th>週數</th>
              <th>狀態</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="p : ${plans}">
              <td class="fw-bold" th:text="${p.name}"></td>
              <td th:text="${p.totalTopics}"></td>
              <td>
                <span th:if="${p.isEnabled}" class="badge bg-success">上架中</span>
                <span th:unless="${p.isEnabled}" class="badge bg-danger">已下架</span>
              </td>
              <td>
                <div class="d-flex gap-2">
                  <a th:href="@{/admin/plans/edit/{id}(id=${p.id})}"
                    class="btn btn-sm btn-outline-primary rounded-pill">📝 編輯</a>

                  <button type="button" class="btn btn-sm btn-outline-success rounded-pill" data-bs-toggle="modal"
                    th:data-bs-target="'#importModal' + ${p.id}">📊 匯入</button>

                  <form th:action="@{/admin/plans/toggle/{id}(id=${p.id})}" method="post">
                    <button type="submit" class="btn btn-sm rounded-pill"
                      th:classappend="${p.isEnabled ? 'btn-outline-danger' : 'btn-success'}"
                      th:text="${p.isEnabled ? '執行下架' : '執行上架'}"></button>
                  </form>
                </div>

                <div class="modal fade" th:id="'importModal' + ${p.id}" tabindex="-1">
                  <div class="modal-dialog">
                    <div class="modal-content">
                      <form th:action="@{/admin/plans/import/{id}(id=${p.id})}" method="post"
                        enctype="multipart/form-data">
                        <div class="modal-header">
                          <h5>匯入主題 - <span th:text="${p.name}"></span></h5>
                        </div>
                        <div class="modal-body">
                          <input type="file" name="file" class="form-control" accept=".xlsx, .xls" required>
                        </div>
                        <div class="modal-footer">
                          <button type="submit" class="btn btn-success">開始匯入</button>
                        </div>
                      </form>
                    </div>
                  </div>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal fade" id="addPlanModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form th:action="@{/admin/plans/add}" method="post">
          <div class="modal-header">
            <h5>建立新挑戰</h5>
          </div>
          <div class="modal-body">
            <input type="text" name="planName" class="form-control" placeholder="計畫名稱" required>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary">確認建立</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
