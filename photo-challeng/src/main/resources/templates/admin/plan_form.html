<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>編輯挑戰內容</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .scroll-box {
      max-height: 60vh;
      overflow-y: auto;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: white;
    }

    .week-item {
      border-bottom: 1px solid #eee;
      padding: 10px 0;
    }
  </style>
</head>

<body class="bg-light">
  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>✍️ 編輯計畫：<span th:text="${plan.name}">名稱</span></h2>
      <a href="/admin/plans" class="btn btn-outline-secondary rounded-pill">取消</a>
    </div>

    <form th:action="@{/admin/plans/save}" method="post">
      <input type="hidden" name="id" th:value="${plan.id}">

      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <label class="form-label fw-bold">計畫名稱修改</label>
          <input type="text" name="name" class="form-control" th:value="${plan.name}">
        </div>
      </div>

      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">52 週任務清單</div>
        <div class="card-body">
          <div class="scroll-box">
            <div th:each="st, iter : ${subThemes}" class="week-row mb-3 row align-items-center">
              <div class="col-1"><span class="badge bg-secondary" th:text="'W'+${st.topicOrder}"></span></div>
              <div class="col-4">
                <input type="text" name="themeTitles" class="form-control" th:value="${st.title}" placeholder="主題">
              </div>
              <div class="col-7">
                <input type="text" name="themeDescs" class="form-control" th:value="${st.description}"
                  placeholder="描述內容">
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="text-end mt-4">
        <button type="submit" class="btn btn-success btn-lg px-5 rounded-pill shadow">儲存變更</button>
      </div>
    </form>
  </div>
</body>

</html>
