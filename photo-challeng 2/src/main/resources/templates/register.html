<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>攝影挑戰 - 註冊</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center" style="height: 100vh;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow">
          <div class="card-body p-5">
            <h2 class="text-center mb-4">📸 加入 52 週挑戰</h2>

            <form th:action="@{/register}" method="post">
              <div class="mb-3">
                <label class="form-label">顯示名稱 (暱稱)</label>
                <input type="text" name="displayName" class="form-control" placeholder="例如：Darren" required>
              </div>

              <div class="mb-3">
                <label class="form-label">Email (登入帳號)</label>
                <input type="email" name="email" class="form-control" placeholder="example@mail.com" required>
              </div>

              <div class="mb-3">
                <label class="form-label">設定密碼</label>
                <input type="password" name="password" class="form-control" placeholder="至少 6 位字元" required>
              </div>

              <button type="submit" class="btn btn-primary w-100 mt-3">立即註冊</button>

              <div class="text-center mt-3">
                <a th:href="@{/login}" class="text-decoration-none text-muted">已有帳號？返回登入</a>
              </div>

              <div th:if="${param.success}" class="alert alert-success">註冊成功！請登入。
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
