<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title th:text="${plan.name} + ' - 主題清單'">計畫詳情</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <div class="container py-5">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/">首頁</a></li>
        <li class="breadcrumb-item active" th:text="${plan.name}">計畫名稱</li>
      </ol>
    </nav>

    <div class="mb-4">
      <h1 th:text="${plan.name}">計畫名稱</h1>
      <p class="lead text-muted" th:text="'這是一個為期 ' + ${plan.totalTopics} + ' 週的攝影挑戰。'"></p>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <table class="table table-hover">
          <thead class="table-dark">
            <tr>
              <th style="width: 80px;">週次</th>
              <th style="width: 200px;">主題</th>
              <th>任務內容</th>
              <th style="width: 100px;">難度</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="theme : ${subThemes}">
              <td class="fw-bold" th:text="'W' + ${theme.topicOrder}">W1</td>
              <td class="text-primary fw-bold" th:text="${theme.title}">標題</td>
              <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 th:text="${plan.name}">計畫名稱</h1>
                <form th:action="@{/plan/{id}/start(id=${plan.id})}" method="post">
                  <button type="submit" class="btn btn-success btn-lg shadow">🚀 開始這項挑戰</button>
                </form>
              </div>
              <td th:text="${theme.description}">描述</td>
              <td>
                <span class="badge bg-warning text-dark" th:text="${theme.difficulty} + ' ★'">1 ★</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</body>

</html>
