<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>上傳作品 - 52 週攝影挑戰</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f4f7f6;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .upload-container {
      max-width: 600px;
      margin: 60px auto;
    }

    .card {
      border: none;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
    }

    .card-title {
      color: #343a40;
    }

    .preview-box {
      width: 100%;
      min-height: 250px;
      border: 2px dashed #cbd5e0;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .preview-box img {
      max-width: 100%;
      max-height: 400px;
      object-fit: contain;
    }

    .btn-primary {
      background-color: #0d6efd;
      border: none;
      padding: 12px;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background-color: #0b5ed7;
    }
  </style>
</head>

<body>

  <div class="container upload-container">
    <div class="card p-4">
      <div class="card-body">
        <div class="text-center mb-4">
          <h2 class="card-title fw-bold">📸 上傳挑戰作品</h2>
          <p class="text-muted small">讓大家看看你的攝影佳作吧！</p>
        </div>

        <form th:action="@{/upload}" method="post" enctype="multipart/form-data">

          <input type="hidden" name="progressId" th:value="${progressId}">
          <input type="hidden" name="planId" th:value="${planId}">

          <div class="mb-4">
            <label class="form-label fw-bold">1. 選擇圖片檔案</label>
            <input type="file" name="file" id="imageInput" class="form-control form-control-lg" accept="image/*"
              required onchange="previewImage(this)">
            <div class="form-text mt-2">支援格式：JPG, PNG。建議尺寸不超過 15MB。</div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-bold">2. 圖片預覽</label>
            <div class="preview-box" id="previewBox">
              <div class="text-center" id="previewPlaceholder">
                <div class="fs-1 text-light-emphasis">🖼️</div>
                <span class="text-muted d-block">尚未選擇檔案</span>
              </div>
            </div>
          </div>

          <div class="d-grid gap-3">
            <button type="submit" class="btn btn-primary btn-lg rounded-pill shadow-sm">確認上傳並完成任務</button>
            <a th:href="@{/dashboard/{id}(id=${planId})}" class="btn btn-link text-decoration-none text-secondary">
              取消並返回儀表板
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    function previewImage(input) {
      const file = input.files[0];
      const previewBox = document.getElementById('previewBox');

      if (file) {
        // 簡單驗證檔案大小 (15MB)
        if (file.size > 15 * 1024 * 1024) {
          alert("檔案太大了！請選擇小於 15MB 的圖片。");
          input.value = "";
          return;
        }

        const reader = new FileReader();
        reader.onload = function (e) {
          previewBox.innerHTML = `<img src="${e.target.result}" alt="Preview" class="animate__animated animate__fadeIn">`;
          previewBox.style.borderStyle = "solid";
          previewBox.style.borderColor = "#0d6efd";
        }
        reader.readAsDataURL(file);
      }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
