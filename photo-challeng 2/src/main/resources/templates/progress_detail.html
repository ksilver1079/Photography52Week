<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>作品詳情</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <div class="container py-5">
    <div class="card mx-auto" style="max-width: 800px;">
      <div class="card-header bg-white">
        <h2 class="fw-bold mb-0" th:text="${progress.subTheme.title}">主題名稱</h2>
        <small class="text-muted"
          th:text="'上傳時間：' + ${#temporals.format(progress.completedAt, 'yyyy-MM-dd HH:mm')}"></small>
      </div>
      <div class="card-body text-center">
        <img th:src="${progress.photoUrl}" class="img-fluid rounded shadow-sm mb-3" alt="攝影作品">
        <img th:if="${progress.photoUrl != null}" th:src="${progress.photoUrl}" class="img-fluid">
        <p th:if="${progress.photoUrl == null}">尚未上傳作品照片</p>
      </div>
      <div class="card-body">
        <p class="text-start" th:text="${progress.subTheme.description}">任務描述...</p>
      </div>
      <div class="card-footer bg-white text-end">
        <a th:href="@{/dashboard/{id}(id=${progress.plan.id})}" class="btn btn-secondary">返回儀表板</a>
      </div>
    </div>
  </div>
</body>

</html>
